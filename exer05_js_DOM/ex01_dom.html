<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload = function() {
            // TODO 1. ID로 제목 선택 및 색상 변경
            let header = document.getElementById('title');

            header.style.color = 'blue';
            // TODO 2. h2 선택 및 텍스트 변경
            let subheader = document.querySelector('h2');

            subheader.innerHTML = "자바스크립트로 변경한 제"
            // TODO 3. class로 여러 요소 선택 및 색상 변경

            let menus = document.getElementsByClassName('item');

            for(let i=0; i<menus.length; i++){
                let menu = menus[i];

                menu.style.color = 'red';
            }

            // TODO 4. name으로 여러 요소 선택 및 배경색 변경
            let articles = document.getElementsByName('message');
            for(let i=0; i<articles.length; i++){
                let article = articles[i];

                article.style.background = 'yellow';
            }
            // TODO 5. 모든 p 요소 선택 및 글자 굵게 변경
            let paragraphs = document.querySelectorAll("p");
            for(let i=0; i<paragraphs.length; i++){
                let paragraph = paragraphs[i]

                paragraph.style.fontWeight = "bold";
            }
        };
    </script>
</head>
<body>
    <h1 id="title">DOM 선택 실습</h1>
    <h2>기존 제목</h2>

    <p class="item">첫 번째 항목</p>
    <p class="item">두 번째 항목</p>
    <p class="item">세 번째 항목</p>

    <p name="message">안녕하세요!</p>
    <p name="message">JavaScript 실습입니다.</p>
</body>
</html>
